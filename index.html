const F={"cardio": "<div class=\"card\"><h2>🫀 有氧（每周 1 次轻松 + 1 次间歇）</h2>\n<div class=\"lv gr\"><b>轻松有氧（Zone 2）· 每周 1 次 · 40 分钟</b><br>户外快走/慢跑、椭圆机或登山机任选。<b>说话测试：能说完整的句子，但唱不了歌。</b>喘到只能蹦单词就放慢；能唱歌就加快一点。晚上做的话 21:30 前结束。</div>\n<div class=\"lv ye\"><b>间歇 · 每周 1 次 · 约 35 分钟（椭圆机或登山机）</b><br>热身 10 分钟 → <b>3 分钟高强度</b>（喘到只能说几个字）+ <b>3 分钟轻松</b> × <b>4 组</b>（第 1–2 周 3 组，留点余力）→ 放松 5 分钟。<br>不放晚上；放非力量日，尽量不放力量前一天。减量周 2–3 组或改 Z2；没睡好 / HI 说恢复偏差 → 改 Z2。登山机手轻扶、别吊着弯腰，腰不适换椭圆机。</div>\n<div class=\"lv\" style=\"background:#f3f4f6;border-left:5px solid #6b7280\"><b>居家备选：壶铃 HIIT（第 5 周后）</b><br>前提：第 5 周及以后、近 2 周腰无不适、已学会髋铰链；晚上不做。<br>热身 + 徒手髋铰链 10 + 轻摆荡 2×10 → 每动作<b>做 30 秒歇 30 秒</b>：①双手摆荡 ②高脚杯深蹲 ③俯卧撑 ④单臂划船（左右轮换），<b>4 轮</b>（第 5–6 周 3 轮），轮间多歇 1 分钟 → 拉伸。<br>摆荡：屁股往前顶、不用手臂和腰抬，荡到胸口高；腰刺痛立即停、退回臀桥。动作变形就停。</div>\n<ul><li>⌚ Watch 记录：户外选「户外步行」/「户外跑步」；椭圆机选「椭圆机」；登山机选「爬楼机」；壶铃 HIIT 选「高强度间歇训练」。补一句感受（轻松/刚好/偏累）。</li>\n<li>快走 20–30 分钟（通勤/带娃）可选，有时间就做。</li></ul></div>", "lumbar": "<div class=\"card\"><h2>🩺 腰部安全（练前给腰打 0–10 分）</h2><p style=\"margin:0 0 8px\"><b>一句话：腰持续疼、疼痛放射到腿或腿发麻，就停练并去医院。</b></p>\n<div class=\"lv gr\"><b>🟢 0–2 分：正常练</b><br>酸胀可以接受，尖锐刺痛不行。</div>\n<div class=\"lv ye\"><b>🟡 3–4 分：降强度</b><br>重量减 20–30%，去掉硬拉/摆荡/深蹲类，换臀桥、死虫式、鸟狗式和上肢动作；练完不应比练前更疼。练中某动作出现刺痛或卡住感，马上停这个动作换替代动作。第二天明显更疼，下次减重或换动作并记下来。</div>\n<div class=\"lv re\"><b>🔴 5 分以上 / 走路弯腰就疼：今天不练力量</b>，只走路+轻柔猫牛式、腹式呼吸。<br><b>停练并就医：</b>疼痛持续加重、休息 1–2 周不见好；疼痛放射到臀部或腿，或腿脚麻木、刺痛、无力；大小便异常、会阴麻木（尽快就医）；夜间疼醒、发热或体重莫名下降。<br><b>立即停止，严重时打 120：</b>胸痛胸闷、头晕眼前发黑、呼吸困难、心跳紊乱。</div></div>", "week": "<div class=\"card\"><h2>📅 一周示例（力量+有氧+休息）</h2>\n<div class=\"sub\"><b>练 3 次力量</b></div><table style=\"font-size:13px\"><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>\n<tr><td>A</td><td>走*</td><td>B</td><td>休</td><td>C</td><td>间歇</td><td>Z2</td></tr></table>\n<div class=\"sub\" style=\"margin-top:10px\"><b>练 4 次力量</b></div><table style=\"font-size:13px\"><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>\n<tr><td>A</td><td>Z2</td><td>B</td><td>休</td><td>C</td><td>间歇</td><td>A简</td></tr></table>\n<div class=\"sub\">A/B/C=力量 · 间歇=椭圆机/登山机约35分钟（白天）· Z2=40分钟轻松有氧 · 走*=快走20–30分钟（可选）· 休=完全休息 · A简=简化版或腿部降强度</div>\n<ul><li>优先级：<b>3 次力量 &gt; 1 次间歇 = 1 次 40 分钟轻松有氧 &gt; 其他快走（可选）</b>。</li>\n<li>间歇不放晚上、不和力量同一天，尽量不放力量前一天。</li>\n<li>练 4 次时放不下：间歇后第二天的力量做简化版或腿部减 1 组、降重量；这周省掉额外快走；Z2 也可接在力量后做。</li>\n<li>每周至少 1 个完全休息日。减量周（第 4、8、12 周）间歇减到 2–3 组或改 Z2。</li></ul></div>", "rules": "<div class=\"card\"><h2>⏱ 时间不固定 / 没睡好怎么办</h2><ul>\n<li><b>A→B→C 只看顺序，不看日期。</b>上次练了 A，下次就练 B。两次之间至少隔一天。</li>\n<li>停了 <b>1 周以内</b>：接着练下一套，重量照旧。</li>\n<li>停了 <b>1–2 周</b>：练下一套，但每个动作少 1 组、重量降约一成。</li>\n<li>停了 <b>2 周以上</b>：从 A 重新开始，按减量周强度练。</li>\n<li>一周只练了 1–2 次：<b>不用补</b>，接着往下走。</li>\n<li>只有 <b>15–20 分钟</b>：做热身 + 前 3 个动作。</li>\n<li>只有 <b>30 分钟</b>：每动作少 1 组（最少 2 组）→ 休息缩到 60 秒 → 删标“可删”的动作。<b>热身和面拉/后背体态动作不删。</b></li>\n<li>一周第 4 练：做 A，或任一套前 3 个动作 + 核心（约 25 分钟）。</li><li>🌙 <b>晚上练</b>（20:30–21:30）：21:30 前结束，不做高强度（最高 RIR 3），23:00 上床。</li>\n<li>😴 <b>前一晚明显没睡好</b>：改做<b>简化版</b>（热身+前 3 个动作、每动作少 1 组、RIR 4），或只快走 20–30 分钟；当天排的是间歇就改 Z2。</li>\n<li>📣 <b>HI 转告“本周恢复偏差”</b>：整周力量按简化版，间歇改 Z2，其他有氧只做轻松快走。</li></ul></div>", "warm": "<div class=\"card\"><h2>🔥 热身（约 6 分钟，每次都做）</h2><table><tr><td>原地快走/开合跳（腰不适就快走）</td><td>60秒</td></tr><tr><td>猫牛式</td><td>慢8次</td></tr><tr><td>死虫式（简化）</td><td>每侧6次</td></tr><tr><td>臀桥+顶峰停2秒</td><td>10次</td></tr><tr><td>胸椎旋转</td><td>每侧6次</td></tr><tr><td>靠墙天使</td><td>8次</td></tr><tr><td>收下巴停3秒</td><td>8次</td></tr><tr><td>第一个动作轻重量预演</td><td>8–10次</td></tr></table><div class=\"sub\">死虫式、臀桥针对骨盆前倾；胸椎旋转、靠墙天使针对圆肩驼背；收下巴针对头前伸。</div></div>", "str": "<div class=\"card\"><h2>🧘 放松拉伸（4–5 分钟）</h2><table><tr><td>半跪髋屈肌拉伸（先夹紧后腿屁股）</td><td>每侧45秒</td></tr><tr><td>门框胸肌拉伸</td><td>每侧30–45秒</td></tr><tr><td>仰卧大腿后侧拉伸（毛巾）</td><td>每侧30秒</td></tr><tr><td>婴儿式</td><td>45秒</td></tr><tr><td>斜方肌/颈侧拉伸（偏高侧多15秒）</td><td>每侧20–30秒</td></tr><tr><td>腹式呼吸 吸4秒呼6秒</td><td>5–8次</td></tr></table></div>", "prog": "<div class=\"card\"><h2>📈 怎么加重量（双重渐进）</h2><ul>\n<li>所有组都做到次数上限、还在规定 RIR 内 → 下次加重；加重后次数掉回下限是正常的。</li>\n<li>哑铃每只手 +1–2 kg；器械 +1 档（约 2.5–5 kg）；深蹲/硬拉/臀推 +2.5–5 kg；平板侧桥 +5–10 秒。</li>\n<li>居家 8 kg 加难度：加次数到 20 → 慢放 3 秒 → 停顿 2 秒 → 单侧/单腿 → 1.5 次 → 休息少 15 秒。</li>\n<li>状态差就保持或减 1 档；同一动作连退 2 次，退 1 档重爬。</li></ul></div>", "posture": "<div class=\"card\"><h2>🪑 工作间隙小练习（3–5 分钟，可选）</h2><ul><li>收下巴停 3 秒 ×10</li><li>站立肩胛后收停 3 秒 ×10</li><li>靠墙天使 ×10</li><li>站立髋屈肌拉伸每侧 30 秒</li><li>坐姿胸椎伸展 ×5</li><li>坐 45–60 分钟就站起来走 2 分钟</li></ul></div>", "food": "<div class=\"card\"><h2>🍚 营养参考（初步）</h2><div class=\"sub\">还不了解你的饮食习惯，按体重估算，之后细调。不节食。</div>\n<table><tr><td>热量</td><td>维持 2200–2500 千卡；想增肌约 2400–2700 千卡</td></tr><tr><td>蛋白质</td><td>105–130 克/天，分 3–4 顿，每顿 25–35 克</td></tr><tr><td>碳水</td><td>250–330 克/天，练的那天多一点</td></tr><tr><td>脂肪</td><td>55–75 克/天，少油炸</td></tr></table>\n<ul><li>每顿：一拳主食 + 一掌蛋白质 + 两拳蔬菜；水 1.5–2 升。</li><li>练前 1–2 小时：香蕉+酸奶，或面包+牛奶。</li><li>练后 2 小时内：正常一顿饭；晚练完饿了喝牛奶+一个鸡蛋。</li><li>体重每月涨 0.5–1 kg 较理想。蛋白粉不是必须。</li></ul></div>", "first": "<div class=\"card\"><h2>🚀 第一周怎么开始</h2><ul>\n<li>目标只有一个：<b>练满 3 次</b>，热身做完整，动作学会，腰不疼。</li>\n<li>第 1 次：<b>A</b>，每动作 2 组，重量轻到有点不好意思（RIR 4）。</li>\n<li>第 2 次（至少隔一天）：<b>B</b>，2 组；用臀推/臀桥，<b>先不做硬拉</b>。</li>\n<li>第 3 次：<b>C</b>，2 组。</li>\n<li>每次记录重量、次数、腰感受，周末发给 Health Intelligence；第 2 周起轻松的动作按规则加。</li><li>不练力量的日子：1 次间歇（第1–2周3组、留余力，白天）+ 1 次 40 分钟轻松有氧，Apple Watch 记录。</li></ul></div>", "over": "<div class=\"card\"><div class=\"eyebrow\">12-WEEK PLAN · v1.2</div><h1>12 周训练计划</h1>\n<div class=\"sub\">每周 3–4 练 · 每次 30–40 分钟 · 每次全身 · 健身房 / 居家 8kg 壶铃 · 另加每周 1 次轻松有氧 + 1 次间歇</div>\n<div class=\"tl\"><div class=\"p1\"><b>第1–4周</b><br>重新上手<br>RIR 3–4 · 2组</div><div class=\"p2\"><b>第5–8周</b><br>逐步加量<br>RIR 2–3 · 3组</div><div class=\"p3\"><b>第9–12周</b><br>增肌加强<br>RIR 1–2 · 3–4组</div></div>\n<div class=\"wk\"><span class=\"\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"d\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"d\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"d\">12</span></div><div class=\"sub\" style=\"margin-top:6px\">蓝色 = 减量周：第4、8周组数减约1组/三分之一、重量减10%、RIR 3–4；第12周前半周减量，后半周小测试+体态照片对比。</div>\n<p style=\"font-size:14px;margin:8px 0 0\"><b>RIR</b> = 做完这组还能再做几次标准动作。RIR 3 就是再硬撑也只能做 3 个。<br><b>进阶前提：</b>2 周腰没变差、动作标准、平均每周练到 3 次。</p></div>"};
</script><script>const $=s=>document.querySelector(s), LS=localStorage, today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const get=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}}, put=(k,v)=>LS.setItem(k,JSON.stringify(v));
let st=get('st',{next:'A',last:null,first:today(),weekManual:null});
if(!st.first){st.first=today()}
let day=get('day',null); if(!day||day.date!==today()) day={date:today(),mode:{A:'gym',B:'gym',C:'gym'},sets:{},start:null,cardioStart:null};
const save=()=>{put('st',st);put('day',day)};
for(let i=0;i<=10;i++){['back','backAfter'].forEach(id=>$('#'+id).insertAdjacentHTML('beforeend',`<option>${i}</option>`))}
for(let i=6;i<=10;i++)$('#rpe').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
for(let i=1;i<=12;i++)$('#week').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
function autoWeek(){return Math.min(12,Math.floor((new Date(today())-new Date(st.first))/864e5/7)+1)}
function week(){return st.weekManual||autoWeek()}
$('#week').value=week(); $('#week').onchange=e=>{st.weekManual=+e.target.value;save();render()};
$('#sleep').checked=!!day.sleep; $('#sleep').onchange=e=>{day.sleep=e.target.checked;save();render()};
if(day.back!=null)$('#back').value=day.back; $('#back').onchange=e=>{day.back=e.target.value;save();backHint()};
function backHint(){let v=day.back;let h='';if(v===''||v==null){$('#backHint').innerHTML='';return}
v=+v; if(v<=2)h='<div class="hint lv gr"><b>🟢 正常练。</b>酸胀可以接受，尖锐刺痛不行。</div>';
else if(v<=4)h='<div class="hint lv ye"><b>🟡 降强度：</b>重量减 20–30%，删掉硬拉/摆荡/深蹲类，换成臀桥、死虫式、鸟狗式、上肢动作；练完不应比练前更疼。</div>';
else h='<div class="hint lv re"><b>🔴 今天不练力量</b>，只走路 + 轻柔的猫牛式、腹式呼吸。</div>';
h+='<div class="hint lv re" style="font-size:13px">腰持续疼、疼痛放射到腿或腿发麻 → 停练并就医。胸痛胸闷、头晕眼前发黑、呼吸困难、心跳紊乱 → 立即停止，严重时打 120。</div>';
$('#backHint').innerHTML=h}
function sinceInfo(){if(!st.last){$('#since').textContent='还没有训练记录';$('#sinceTip').textContent='第一次：从 A 开始，每个动作 2 组，重量轻一点。';return}
const d=Math.round((new Date(today())-new Date(st.last))/864e5);$('#since').textContent=`距上次训练 ${d} 天`;
let t= d<1?'今天已经练过了，两次之间至少隔一天。':d<=7?'停练 1 周以内：直接练下一套，重量照旧。':d<=14?'停练 1–2 周：练下一套，但每个动作少做 1 组，重量降约一成，下次恢复。':'停练 2 周以上：从 A 重新开始，这一周按减量周强度练。';
$('#sinceTip').textContent=t}
function cycle(n){const o='ABC';st.next=o[(o.indexOf(st.next)+n+3)%3];save();render();show(st.next)}
const phaseRIR=w=>w<=4?'RIR 3–4':w<=8?'RIR 2–3':'RIR 1–2';
function nSets(sets,w){let m=sets.match(/^(\d)/);let N=m?+m[1]:3;let n= w<=2?2: [4,8,12].includes(w)?Math.max(1,N-1):N; if(day.sleep)n=Math.max(1,n-1);return n}
function visible(e,w){if(/第5周起/.test(e[0]))return w>=5;if(/第1–4周/.test(e[0])&&!/可用/.test(e[0]))return w<=4;return true}
function rest(r){const m=r.match(/(\d+)/);return m?+m[1]:60}
const tabs=[['A','力量 A'],['B','力量 B'],['C','力量 C'],['cardio','有氧'],['warm','热身/拉伸'],['week','周表'],['lumbar','腰部安全']];
let cur=st.next;
function show(k){cur=k;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hide',v.id!=='v-'+k));$('#genBtn').classList.toggle('hide',!'ABC'.includes(k))}
function exCard(k,mode,i,e,w){const n=nSets(e[1],w);const id=`${k}-${mode}-${i}`;const sd=day.sets[id]||[];
let rows='';for(let s=0;s<n;s++){const x=sd[s]||{};rows+=`<div class="setrow"><button class="dot ${x.ok?'ok':''}" data-id="${id}" data-s="${s}" data-r="${rest(e[2])}" data-name="${e[0]}">${s+1}</button><input type="number" inputmode="decimal" placeholder="kg" value="${x.kg||''}" data-id="${id}" data-s="${s}" data-f="kg"><span>×</span><input type="number" inputmode="numeric" placeholder="次" value="${x.rep||''}" data-id="${id}" data-s="${s}" data-f="rep"></div>`}
const rir=day.sleep?'RIR 4':e[3];
const det=[['选重量',e[4]],['要领',e[5]],['常见错误',e[6]],['安全',e[7]],['替代动作',e[8]]].filter(x=>x[1]!=='—').map(x=>`<p><b>${x[0]}：</b>${x[1]}</p>`).join('');
return `<div class="ex"><div class="n">${e[0]}</div><span class="tag">${n} 组 · ${e[1]}</span>${e[2]!=='—'?`<span class="tag g">休息 ${e[2]}</span>`:''}${rir!=='—'?`<span class="tag g">${rir}</span>`:''}<details><summary>要领 / 常见错误 / 替代动作</summary>${det}</details>${rows}</div>`}
function render(){const w=week();$('#week').value=w;$('#nextSet').textContent=st.next;sinceInfo();backHint();
$('#weekNote').textContent=(st.weekManual?'手动':'按首次使用日期推算')+` · 本阶段 ${phaseRIR(w)}`+([4,8,12].includes(w)?' · 减量周':'');
let h='';for(const k of 'ABC'){const s=S[k],mode=day.mode[k];let list=s[mode].map((e,i)=>[e,i]).filter(([e])=>visible(e,w));if(day.sleep)list=list.slice(0,3);
h+=`<div class="view" id="v-${k}"><div class="card"><h2>训练 ${k}</h2><div class="sub">${s.title}</div>
<div class="row"><button class="btn ${mode==='gym'?'blue':''}" onclick="setMode('${k}','gym')">🏋️ 健身房</button><button class="btn ${mode==='home'?'blue':''}" onclick="setMode('${k}','home')">🏠 居家壶铃</button></div>
${day.sleep?'<div class="hint lv ye">😴 简化版：热身 + 前 3 个动作、每动作少 1 组、RIR 4。</div>':''}
<div class="row"><button class="btn pri" onclick="startW()">${day.start?'已开练 '+new Date(day.start).toTimeString().slice(0,5):'▶ 开练（开始计时）'}</button></div>
<div class="note">先做热身（见“热身/拉伸”）。勾选一组后自动开始组间休息倒计时。</div>
${list.map(([e,i])=>exCard(k,mode,i,e,w)).join('')}</div></div>`}
h+=`<div class="view" id="v-cardio">${F.cardio}<div class="card"><h2>⏱ 间歇计时器</h2>
${day.sleep?'<div class="hint lv ye">😴 昨晚没睡好：今天间歇改成 40 分钟轻松有氧（Zone 2）。</div>':''}
<div class="row">高强度组数 <select id="ivN"><option>3</option><option>4</option></select><span class="note">第 1–2 周 3 组；减量周 2–3 组或改 Zone 2</span></div>
<div class="phase" id="ivPhase">准备</div><div class="big" id="ivTime">--:--</div><div class="note" style="text-align:center" id="ivNext"></div>
<div class="row" style="justify-content:center"><button class="btn pri" onclick="ivStart()">开始</button><button class="btn" onclick="ivStop()">结束</button></div></div></div>`;
h+=`<div class="view" id="v-warm">${F.warm}${F.str}${F.posture}</div><div class="view" id="v-week">${F.week}${F.rules}</div><div class="view" id="v-lumbar">${F.lumbar}</div>`;
$('#views').innerHTML=h;
if(w<=2)$('#ivN').value='3';
show(cur)}
$('#nav').innerHTML=tabs.map(([k,t])=>`<button data-k="${k}" onclick="show('${k}')">${t}</button>`).join('');
function setMode(k,m){day.mode[k]=m;save();render()}
function startW(){if(!day.start){day.start=Date.now();save();render()}}
document.addEventListener('click',e=>{const b=e.target.closest('.dot');if(!b)return;const {id,s}=b.dataset;day.sets[id]=day.sets[id]||[];const x=day.sets[id][s]=day.sets[id][s]||{};x.ok=!x.ok;if(!day.start)day.start=Date.now();save();b.classList.toggle('ok',x.ok);if(x.ok)startRest(+b.dataset.r,b.dataset.name)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;const {id,s,f}=t.dataset;day.sets[id]=day.sets[id]||[];(day.sets[id][s]=day.sets[id][s]||{})[f]=t.value;save()});
// audio/vibrate
let actx;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(actx.currentTime+.4)}catch(e){} if(navigator.vibrate)navigator.vibrate([300,100,300])}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
let rest_={end:0,iv:null};
function startRest(sec,name){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}stopRest();rest_.end=Date.now()+sec*1000;$('#tLabel').textContent='组间休息';$('#timer').style.display='block';
const tick=()=>{const left=Math.ceil((rest_.end-Date.now())/1000);if(left<=0){$('#tVal').textContent='开始下一组！';beep();clearInterval(rest_.iv);rest_.iv=null;setTimeout(()=>{if(!rest_.iv)$('#timer').style.display='none'},4000);return}$('#tVal').textContent=fmt(left)};tick();rest_.iv=setInterval(tick,250)}
function stopRest(){clearInterval(rest_.iv);rest_.iv=null;$('#timer').style.display='none'}
// interval
let iv={plan:null,start:0,t:null};
function ivStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}const n=+$('#ivN').value;const p=[['热身',600]];for(let i=1;i<=n;i++){p.push([`第 ${i}/${n} 组 · 高强度（喘到只能说几个字）`,180]);p.push([`第 ${i}/${n} 组 · 轻松`,180])}p.push(['放松',300]);
iv.plan=p;iv.start=Date.now();iv.last=-1;if(!day.cardioStart){day.cardioStart=iv.start;save()}clearInterval(iv.t);iv.t=setInterval(ivTick,250);ivTick()}
function ivTick(){let el=(Date.now()-iv.start)/1000,acc=0;for(let i=0;i<iv.plan.length;i++){const [n,d]=iv.plan[i];if(el<acc+d){if(iv.last!==i){if(iv.last>=0)beep();iv.last=i}$('#ivPhase').textContent=n;$('#ivPhase').style.color=/高强度/.test(n)?'#dc2626':'#111';$('#ivTime').textContent=fmt(Math.ceil(acc+d-el));$('#ivNext').textContent=i+1<iv.plan.length?'下一段：'+iv.plan[i+1][0]:'最后一段';return}acc+=d}
beep();clearInterval(iv.t);$('#ivPhase').textContent='完成 ✅';$('#ivTime').textContent='00:00';$('#ivNext').textContent=''}
function ivStop(){clearInterval(iv.t);$('#ivPhase').textContent='已结束';}
// logs
function common(){let s=`腰部（练前）：${day.back!==''&&day.back!=null?day.back+'/10':'未填'}\n昨晚没睡好：${day.sleep?'是（简化版）':'否'}\n`;const a=$('#backAfter').value,r=$('#rpe').value,m=$('#memo').value.trim();if(a)s+=`练后腰部：${a}/10\n`;if(r)s+=`整体 RPE：${r}\n`;if(m)s+=`备注：${m}\n`;return s}
function genLog(){const k='ABC'.includes(cur)?cur:st.next,mode=day.mode[k],w=week();let lines=[];
S[k][mode].forEach((e,i)=>{const sd=(day.sets[`${k}-${mode}-${i}`]||[]).filter(x=>x&&(x.ok||x.kg||x.rep));if(!sd.length)return;lines.push(`· ${e[0]}：`+sd.map(x=>`${x.kg?x.kg+'kg':'自重'}×${x.rep||'?'}`).join('，'))});
const mins=day.start?Math.round((Date.now()-day.start)/60000):null;
let t=`【训练记录】${today()}\n训练 ${k} · ${mode==='gym'?'健身房版':'居家壶铃版'} · 第 ${w} 周${day.sleep?' · 简化版':''}\n`+common()+(lines.length?lines.join('\n'):'（未记录动作）')+`\n用时：${mins!=null?mins+' 分钟':'未计时'}\n—— 发给 Health Intelligence`;
st.last=today();st.next='ABC'[('ABC'.indexOf(k)+1)%3];save();output(t);render();show(k)}
function genCardio(){const mins=day.cardioStart?Math.round((Date.now()-day.cardioStart)/60000):null;const n=iv.plan?(iv.plan.length-2)/2:null;
const t=`【有氧记录】${today()}\n类型：${iv.plan?`间歇 ${n} 组（3 分钟高强度 + 3 分钟轻松）`:'轻松有氧 / 快走（详见 Apple Watch）'}\n`+common()+`用时：${mins!=null?mins+' 分钟':'见 Apple Watch'}\n—— 发给 Health Intelligence`;output(t)}
function output(t){const o=$('#out');o.value=t;o.classList.remove('hide');const ok=()=>$('#copyMsg').textContent='✅ 已复制，粘贴发给 Health Intelligence';const fail=()=>{$('#copyMsg').textContent='自动复制失败：请长按上方文本框全选复制';o.focus();o.select()};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fail);else{o.select();try{document.execCommand('copy')?ok():fail()}catch(e){fail()}}}
render();
</script></body></html>
